syntax = "proto3";

package az.fitnest.order;

option java_multiple_files = true;
option java_package = "az.fitnest.order.grpc";
option java_outer_classname = "UserSubscriptionProto";

service UserSubscriptionService {
  rpc GetActiveSubscription(GetActiveSubscriptionRequest) returns (ActiveSubscriptionResponse);
  rpc GetUserIdsByPackageId(GetUserIdsByPackageIdRequest) returns (GetUserIdsByPackageIdResponse);
  rpc GetUserIdsByDurationMonths(GetUserIdsByDurationMonthsRequest) returns (GetUserIdsByPackageIdResponse);
  rpc GetUserIdsByType(GetUserIdsByTypeRequest) returns (GetUserIdsByPackageIdResponse);
  rpc FreezeSession(FreezeSessionRequest) returns (FreezeSessionResponse);
  rpc RestoreSession(RestoreSessionRequest) returns (RestoreSessionResponse);
  rpc ConsumeFrozenSession(ConsumeFrozenSessionRequest) returns (ConsumeFrozenSessionResponse);
  rpc GetHomeGymContext(GetHomeGymContextRequest) returns (GetHomeGymContextResponse);
}

// Home-gym context used by catalog to rank/price gyms for a subscription (R1/R14).
message GetHomeGymContextRequest {
  int64 user_id = 1;
  int64 subscription_id = 2;
}

message GetHomeGymContextResponse {
  bool found = 1;
  int64 subscription_id = 2;
  int64 user_id = 3;
  int64 package_id = 4;
  string subscription_status = 5;
  string entry_mode = 6;
  int64 home_gym_id = 7;
  int64 home_visits_this_period = 8;
  int64 standard_visits_this_period = 9;
  string period_ends_at = 10;
  string valid_until = 11;
  bool active = 12;
}

message FreezeSessionRequest {
  int64 user_id = 1;
}

message FreezeSessionResponse {
  bool success = 1;
}

message RestoreSessionRequest {
  int64 user_id = 1;
}

message RestoreSessionResponse {
  bool success = 1;
}

message ConsumeFrozenSessionRequest {
  int64 user_id = 1;
}

message ConsumeFrozenSessionResponse {
  bool success = 1;
}

message GetActiveSubscriptionRequest {
  int64 user_id = 1;
}

message ActiveSubscriptionResponse {
  string package_name = 1;
  string subscription_status = 2;  // ACTIVE, FROZEN, or empty for no subscription
  int64 package_id = 3;
  int32 total_limit = 4;
  int32 remaining_limit = 5;
  string expires_at = 6;
}

message GetUserIdsByPackageIdRequest {
  int64 package_id = 1;
}

message GetUserIdsByPackageIdResponse {
  repeated int64 user_ids = 1;
}

message GetUserIdsByDurationMonthsRequest {
  int32 duration_months = 1;
}

message GetUserIdsByTypeRequest {
  string type = 1; // all, active, expired, upgraded, last_7_days
}
