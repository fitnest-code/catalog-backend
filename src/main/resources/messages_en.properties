# Validation Errors
error.validation = An error occurred during data validation
error.invalid_field = The provided data is invalid
error.missing_field = A required field is missing
error.out_of_range = The provided value is outside the allowed range
error.invalid_format = Invalid data format

# Authentication Errors
error.unauthorized = Please log in to continue
error.invalid_credentials = Invalid login credentials
error.token_expired = The session has expired. Please log in again
error.account_locked = Access to the account is temporarily restricted
error.account_disabled = The account is currently inactive

# Authorization Errors
error.forbidden = You do not have permission to perform this action
error.access_denied = Access denied

# Request Format Errors
error.invalid_request = Invalid request
error.invalid_json_format = Invalid JSON format
error.unsupported_media_type = Unsupported media type
error.method_not_allowed = This HTTP method is not supported

# Server Errors
error.internal_server_error = A technical error occurred. Please try again later
error.service_unavailable = The service is temporarily unavailable
error.unexpected = An unexpected error occurred

# Resource Errors
error.resource_not_found = Requested data was not found
error.resource_already_exists = This data already exists
error.resource_conflict = A data conflict occurred

# Rate Limiting Errors
error.too_many_requests = Too many requests were sent. Please wait a moment
error.rate_limit_exceeded = Request limit exceeded

# Service Specific Errors
error.constraint_violation = A constraint violation occurred
error.plan_not_found = The requested information is not available
error.subscription_not_enabled = The required conditions for this operation are not satisfied
error.invalid_categories = One or more category IDs are invalid
error.invalid_input = The number of room names must match the number of images
error.file_upload_failed = File upload failed
error.file_empty = The file cannot be empty
error.file_too_large = The file size exceeds the allowed limit (5MB)
error.invalid_file_type = Only JPG, PNG, and WEBP image formats are allowed
error.gym_image_mismatch = The provided image does not match the request
error.gym_not_found = Requested data was not found
error.store_not_found = Requested data was not found
error.trainer_not_found = Requested data was not found
error.checkin_failed = The check-in process failed
error.profession_already_exists = The operation cannot be completed with the provided information
error.profession_not_found = Requested data was not found
error.gym_image_not_found = Requested data was not found
error.rpc_failed = An error occurred while processing the request