# Validation Errors
error.validation = An error occurred during data validation
error.invalid_field = The entered data is invalid
error.missing_field = A required field was not provided
error.out_of_range = The entered value is outside the allowed range
error.invalid_format = Invalid data format

# Authentication Errors
error.unauthorized = Please log in to continue
error.invalid_credentials = Username or password is incorrect
error.token_expired = The session has expired. Please log in again
error.account_locked = Your account has been temporarily locked
error.account_disabled = Your account is disabled

# Authorization Errors
error.forbidden = You do not have permission to perform this action
error.access_denied = Access denied

# Request Format Errors
error.invalid_request = Invalid request
error.invalid_json_format = Invalid JSON format in the request
error.unsupported_media_type = Unsupported media type
error.method_not_allowed = This HTTP method is not supported

# Server Errors
error.internal_server_error = A technical error occurred. Please try again later
error.service_unavailable = The service is temporarily unavailable
error.unexpected = An unexpected error occurred

# Resource Errors
error.resource_not_found = Data not found
error.resource_already_exists = This data already exists
error.resource_conflict = A data conflict occurred

# Rate Limiting Errors
error.too_many_requests = Too many requests were sent. Please wait a moment
error.rate_limit_exceeded = Daily request limit exceeded

# Service Specific Errors
error.constraint_violation = A constraint violation occurred
error.plan_not_found = Membership plan does not exist or is inactive
error.subscription_not_enabled = This subscription plan is not enabled for the gym
error.invalid_categories = One or more category IDs are invalid
error.invalid_input = The number of room names must match the number of images
error.file_upload_failed = File upload failed. File must be at least 5MB or a server error occurred
error.file_empty = File cannot be empty
error.file_too_large = File size exceeds the 5MB limit
error.invalid_file_type = Only JPG, PNG, and WEBP image formats are allowed
error.gym_image_mismatch = The image does not belong to the specified gym
error.gym_not_found = Gym not found
error.store_not_found = Store not found
error.trainer_not_found = Trainer not found
error.checkin_failed = Check-in process failed
error.profession_already_exists = A profession with this name already exists
error.profession_not_found = Profession not found
error.gym_image_not_found = Image not found
error.rpc_failed = Communication with another service failed