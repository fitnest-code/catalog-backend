# Request Format Errors
error.invalid_request = Неверный запрос
error.invalid_json_format = Неверный формат JSON
error.unsupported_media_type = Неподдерживаемый тип медиа
error.method_not_allowed = Этот метод HTTP не поддерживается

# Server Errors
error.internal_server_error = Произошла техническая ошибка. Пожалуйста, попробуйте позже
error.service_unavailable = Сервис временно недоступен
error.unexpected = Произошла непредвиденная ошибка

# Resource Errors
error.resource_not_found = Запрашиваемая информация не найдена
error.resource_already_exists = Эта информация уже существует
error.resource_conflict = Обнаружен конфликт данных

# Rate Limiting Errors
error.too_many_requests = Отправлено слишком много запросов. Пожалуйста, подождите
error.rate_limit_exceeded = Превышен лимит запросов

# Service Specific Errors
error.constraint_violation = Произошло нарушение ограничений
error.plan_not_found = Запрашиваемая информация недоступна
error.subscription_not_enabled = Условия для выполнения операции не соблюдены
error.invalid_categories = Один или несколько идентификаторов категорий неверны
error.invalid_input = Количество названий залов должно совпадать с количеством изображений
error.file_upload_failed = Ошибка загрузки файла
error.file_empty = Файл не может быть пустым
error.file_too_large = Размер файла превышает лимит 5 МБ
error.invalid_file_type = Разрешены только изображения в форматах JPG, PNG и WEBP
error.gym_image_mismatch = Предоставленное изображение не подходит
error.gym_not_found = Запрашиваемая информация не найдена
error.store_not_found = Запрашиваемая информация не найдена
error.trainer_not_found = Запрашиваемая информация не найдена
error.checkin_failed = Процесс регистрации не удался
error.profession_already_exists = Операция с этими данными невозможна
error.profession_not_found = Запрашиваемая информация не найдена
error.gym_image_not_found = Запрашиваемая информация не найдена
error.rpc_failed = Произошла ошибка при обработке запроса
