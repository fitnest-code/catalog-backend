# One-shot DEV seed: wipe [DEV-SCENARIO]* gyms and insert Fully Filled (+ thin edge cases).
# Apply: kubectl --context aks-fitnest-prod -n fitnest-development apply -f scripts/seed-dev-fully-filled-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: fitnest-seed-fully-filled
  namespace: fitnest-development
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: python:3.12-alpine
          env:
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: vault-approle-secret
                  key: role-id
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: vault-approle-secret
                  key: secret-id
          command: ["sh", "-ec"]
          args:
            - |
              apk add --no-cache postgresql-client >/dev/null
              python3 - <<'PY'
              import json, os, re, subprocess, urllib.request

              vault = "http://vault-dev.fitnest-development.svc.cluster.local:8200"
              role_id = os.environ["VAULT_ROLE_ID"]
              secret_id = os.environ["VAULT_SECRET_ID"]
              login_req = urllib.request.Request(
                  f"{vault}/v1/auth/approle/login",
                  data=json.dumps({"role_id": role_id, "secret_id": secret_id}).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              token = json.load(urllib.request.urlopen(login_req))["auth"]["client_token"]
              sec_req = urllib.request.Request(
                  f"{vault}/v1/secrets/data/catalog-backend/development",
                  headers={"X-Vault-Token": token},
              )
              data = json.load(urllib.request.urlopen(sec_req))["data"]["data"]
              url = data["spring.datasource.url"]
              user = data["spring.datasource.username"]
              pwd = data["spring.datasource.password"]
              # jdbc:postgresql://host:port/db
              m = re.match(r"jdbc:postgresql://([^:/]+):?(\d+)?/([^?]+)", url)
              host, port, db = m.group(1), m.group(2) or "5432", m.group(3)
              env = os.environ.copy()
              env["PGPASSWORD"] = pwd

              def psql(sql, fetch=False):
                  cmd = [
                      "psql", "-h", host, "-p", str(port), "-U", user, "-d", db,
                      "-v", "ON_ERROR_STOP=1", "-At", "-c", sql,
                  ]
                  r = subprocess.run(cmd, env=env, capture_output=True, text=True)
                  if r.returncode != 0:
                      raise SystemExit(f"psql failed:\n{r.stderr}\nSQL={sql[:200]}")
                  if not fetch:
                      return None
                  # Drop blank lines and command tags like "INSERT 0 1".
                  lines = []
                  for line in r.stdout.splitlines():
                      s = line.strip()
                      if not s or s.startswith("INSERT ") or s.startswith("DELETE ") or s.startswith("UPDATE "):
                          continue
                      lines.append(s)
                  return "\n".join(lines)

              def psql_one(sql):
                  out = psql(sql, fetch=True)
                  if not out:
                      raise SystemExit(f"expected one row, got empty for SQL={sql[:160]}")
                  return out.splitlines()[0]

              # Keep sequences valid after prior wipes.
              psql("SELECT setval(pg_get_serial_sequence('gyms','id'), COALESCE((SELECT MAX(id) FROM gyms), 1));")

              cat_rows = psql("SELECT id, name FROM categories ORDER BY id LIMIT 8;", fetch=True)
              cats = []
              for line in cat_rows.splitlines():
                  if not line.strip():
                      continue
                  cid, name = line.split("|", 1)
                  cats.append((int(cid), name))
              print("categories=", cats)
              if len(cats) < 3:
                  raise SystemExit("need at least 3 categories")

              svc_rows = psql("SELECT id FROM supported_services ORDER BY id LIMIT 5;", fetch=True)
              svc_ids = [int(x) for x in svc_rows.splitlines() if x.strip()]
              print("services=", svc_ids)

              pkg_rows = psql("SELECT DISTINCT package_id FROM gym_package_price ORDER BY package_id LIMIT 8;", fetch=True)
              pkgs = [int(x) for x in pkg_rows.splitlines() if x.strip()]
              if len(pkgs) < 4:
                  pkgs = [1201, 1202, 1203, 1204]
              pkgs = pkgs[:4]
              tiers = ["BRONZE", "SILVER", "GOLD", "PLATINUM"]
              print("packages=", pkgs)

              PREFIX = "[DEV-SCENARIO] "
              old = psql(f"SELECT id FROM gyms WHERE name LIKE '{PREFIX}%';", fetch=True)
              old_ids = [int(x) for x in old.splitlines() if x.strip()]
              if old_ids:
                  ids = ",".join(str(i) for i in old_ids)
                  print("deleting old scenario gyms", ids)
                  for sql in [
                      f"DELETE FROM gym_entrance_history WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_category_package_price WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_category_work_hours WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_category_services WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_package_price WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_membership_policy_v4 WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_subscription_services WHERE gym_subscription_id IN (SELECT id FROM gym_subscriptions WHERE gym_id IN ({ids}))",
                      f"DELETE FROM gym_subscriptions WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_descriptions WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_main_categories WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_sub_categories WHERE gym_id IN ({ids})",
                      f"DELETE FROM gym_general_work_hours WHERE gym_id IN ({ids})",
                      f"DELETE FROM gyms WHERE id IN ({ids})",
                  ]:
                      try:
                          psql(sql)
                      except SystemExit as e:
                          print("skip:", str(e)[:120])

              def insert_gym(name, slug, lat, lng, mains, subs, has_subs, phone, email, home_eligible=False):
                  gid = int(psql_one(f"""
                  INSERT INTO gyms (
                    name, description, phone, email, status, has_subcategories, home_eligible,
                    is_reservation_enabled, rating, reviews_count, is_new,
                    cover_image_url, created_date, last_modified_date, version,
                    address_text, city, latitude, longitude
                  ) VALUES (
                    '{name}',
                    'Synthetic DEV scenario gym ({slug}). Fully wired for admin/mobile QA. Safe to delete.',
                    '{phone}',
                    '{email}',
                    'ACTIVE',
                    {str(has_subs).lower()},
                    {str(home_eligible).lower()},
                    true,
                    4.7,
                    12,
                    true,
                    'https://fitnest.az/static/dev/{slug}-cover.jpg',
                    NOW(), NOW(), 0,
                    'DEV scenario, Baku',
                    'Baku',
                    {lat}, {lng}
                  ) RETURNING id;
                  """))
                  psql(f"""
                  UPDATE gyms SET
                    qr_code_value='https://fitnest.az/gym/{gid}',
                    qr_code_token='DEV-SCENARIO-{slug.upper()}-{gid}'
                  WHERE id={gid};
                  """)
                  for cid, _ in mains:
                      psql(f"INSERT INTO gym_main_categories (gym_id, category_id) VALUES ({gid}, {cid}) ON CONFLICT DO NOTHING;")
                  for cid, _ in subs:
                      psql(f"INSERT INTO gym_sub_categories (gym_id, category_id) VALUES ({gid}, {cid}) ON CONFLICT DO NOTHING;")
                  for period in range(7):
                      psql(f"""
                      INSERT INTO gym_general_work_hours (gym_id, period, from_time, to_time)
                      VALUES ({gid}, {period}, '08:00', '22:00');
                      """)
                  return gid

              # --- Fully Filled ---
              full_name = PREFIX + "Fully Filled"
              mains = [cats[0]]
              subs = cats[1:3]
              gid = insert_gym(full_name, "fully-filled", 40.3835, 49.8560, mains, subs, True,
                               "+994501112233", "dev-fully-filled@fitnest.az", True)
              print("Fully Filled id=", gid)

              for i, pkg in enumerate(pkgs):
                  single = 10 + i * 2
                  monthly = 80 + i * 20
                  psql(f"""
                  INSERT INTO gym_package_price
                    (gym_id, package_id, included, single_price, unlimited_price, effective_from, home_eligible, version, created_date, last_modified_date)
                  VALUES ({gid}, {pkg}, true, {single}, {monthly}, '2026-01-01', true, 0, NOW(), NOW());
                  """)
                  psql(f"""
                  INSERT INTO gym_subscriptions (gym_id, package_id, daily_price, created_date, last_modified_date, version)
                  VALUES ({gid}, {pkg}, {single}, NOW(), NOW(), 0);
                  """)

              policy = {
                  "version": 0,
                  "timeRulesEnabled": False,
                  "packages": [
                      {
                          "packageId": pkgs[i],
                          "tier": tiers[i],
                          "included": True,
                          "primaryEnabled": True,
                          "entryPrice": round(10 + i * 2, 2),
                          "primaryMonthlyPrice": round(80 + i * 20, 2),
                          "categories": [],
                          "primaryDisabledAt": None,
                      }
                      for i in range(4)
                  ],
                  "timeRules": [],
              }
              payload = json.dumps(policy).replace("'", "''")
              psql(f"""
              INSERT INTO gym_membership_policy_v4 (gym_id, version, payload)
              VALUES ({gid}, 0, '{payload}')
              ON CONFLICT (gym_id) DO UPDATE SET payload = EXCLUDED.payload, version = gym_membership_policy_v4.version + 1;
              """)

              for role, arr in (("MAIN", mains), ("SUB", subs)):
                  for cid, cname in arr:
                      desc = f"{role} offering for {cname} at Fully Filled"
                      psql(f"""
                      INSERT INTO gym_descriptions (gym_id, category_id, description, phone, cover_image_url)
                      VALUES ({gid}, {cid}, '{desc.replace("'", "''")}', '+994501112233',
                              'https://fitnest.az/static/dev/cat-{cid}.jpg');
                      """)

              for sidx, (cid, _) in enumerate(subs):
                  for i, pkg in enumerate(pkgs):
                      single = 18 + sidx * 3 + i
                      # single-entry only for categories (v6)
                      psql(f"""
                      INSERT INTO gym_category_package_price
                        (gym_id, category_id, package_id, single_price, unlimited_price, effective_from, version, created_date, last_modified_date)
                      VALUES ({gid}, {cid}, {pkg}, {single}, NULL, '2026-01-01', 0, NOW(), NOW());
                      """)
                  for period in range(7):
                      psql(f"""
                      INSERT INTO gym_category_work_hours (gym_id, category_id, period, from_time, to_time)
                      VALUES ({gid}, {cid}, {period}, '10:00', '20:00');
                      """)
                  for sid in svc_ids[:3]:
                      psql(f"""
                      INSERT INTO gym_category_services (gym_id, category_id, supported_service_id)
                      VALUES ({gid}, {cid}, {sid}) ON CONFLICT DO NOTHING;
                      """)

              main_id = mains[0][0]
              sub_id = subs[0][0]
              pkg0 = pkgs[0]
              psql(f"""
              INSERT INTO gym_entrance_history
                (user_id, gym_id, scan_date, status, platform, amount, package_id, category_id, created_date, last_modified_date, version)
              VALUES
                (900000001, {gid}, NOW() - INTERVAL '2 days', 'ELIGIBLE', 'DEV_SEED', 10, {pkg0}, NULL, NOW(), NOW(), 0),
                (900000001, {gid}, NOW() - INTERVAL '1 days', 'ELIGIBLE', 'DEV_SEED', 10, {pkg0}, {main_id}, NOW(), NOW(), 0),
                (900000002, {gid}, NOW() - INTERVAL '3 hours', 'ELIGIBLE', 'DEV_SEED', 18, {pkg0}, {sub_id}, NOW(), NOW(), 0),
                (900000003, {gid}, NOW() - INTERVAL '5 hours', 'UNSUCCESSFUL', 'DEV_SEED', 0, {pkg0}, {sub_id}, NOW(), NOW(), 0);
              """)

              # --- Main-only (null category still works) ---
              mid = insert_gym(PREFIX + "Main-only Gym", "main-only", 40.3790, 49.8480,
                               [cats[0]], [], False, "+994509990001", "dev-main-only@fitnest.az")
              psql(f"""
              INSERT INTO gym_package_price
                (gym_id, package_id, included, single_price, unlimited_price, effective_from, home_eligible, version, created_date, last_modified_date)
              VALUES ({mid}, {pkg0}, true, 10, 80, '2026-01-01', false, 0, NOW(), NOW());
              """)

              # --- Multi-Sub Mixed (second sub has no price) ---
              mixed_subs = cats[1:3]
              xid = insert_gym(PREFIX + "Multi-Sub Mixed", "multi-sub", 40.3810, 49.8520,
                               [cats[0]], mixed_subs, True, "+994509990002", "dev-multi-sub@fitnest.az")
              psql(f"""
              INSERT INTO gym_package_price
                (gym_id, package_id, included, single_price, unlimited_price, effective_from, home_eligible, version, created_date, last_modified_date)
              VALUES ({xid}, {pkg0}, true, 10, 80, '2026-01-01', false, 0, NOW(), NOW());
              """)
              psql(f"""
              INSERT INTO gym_category_package_price
                (gym_id, category_id, package_id, single_price, unlimited_price, effective_from, version, created_date, last_modified_date)
              VALUES ({xid}, {mixed_subs[0][0]}, {pkg0}, 20, NULL, '2026-01-01', 0, NOW(), NOW());
              """)

              print("CREATED:")
              print(f" - {full_name} id={gid}")
              print(f" - {PREFIX}Main-only Gym id={mid}")
              print(f" - {PREFIX}Multi-Sub Mixed id={xid}")
              print("DONE")
              PY
